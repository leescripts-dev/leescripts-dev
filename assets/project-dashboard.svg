<svg width="400" height="540" viewBox="0 0 400 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .window { fill:#0d1117; stroke:#30363d; stroke-width:1.5; }
      .header { fill:#161b22; }
      .title {
        fill:#f0f6fc;
        font:700 16px "JetBrains Mono","Fira Code",monospace;
      }
      .prompt {
        fill:#58a6ff;
        font:600 13px "JetBrains Mono","Fira Code",monospace;
      }
      .text {
        fill:#c9d1d9;
        font:13px "JetBrains Mono","Fira Code",monospace;
      }
      .active {
        fill:#3fb950;
        font:600 13px "JetBrains Mono","Fira Code",monospace;
      }
      .planned {
        fill:#d29922;
        font:600 13px "JetBrains Mono","Fira Code",monospace;
      }
      .divider{
        stroke:#30363d;
        stroke-width:1;
      }
    </style>
  </defs>

  <!-- Window -->
  <rect class="window" x="1" y="1" width="898" height="538" rx="10"/>

  <!-- Header -->
  <rect class="header" x="1" y="1" width="898" height="36" rx="10"/>
  <text x="20" y="24" class="title">Project Dashboard</text>

  <!-- Prompt -->
  <text x="20" y="58" class="prompt">lee@wolf:~/projects$</text>
  <text x="205" y="58" class="text">tree</text>

  <line x1="20" y1="70" x2="880" y2="70" class="divider"/>

  <text x="20" y="96" class="text">.</text>

  <!-- WolfScan -->
  <text x="20" y="122" class="text">├── 🐺 WolfScan</text>
  <text x="56" y="146" class="text">│   ├── discovery/</text>
  <text x="56" y="170" class="text">│   ├── fingerprinting/</text>
  <text x="56" y="194" class="text">│   ├── cve-intel/</text>
  <text x="56" y="218" class="text">│   ├── risk-engine/</text>
  <text x="56" y="242" class="active">│   └── 🟢 ACTIVE</text>

  <text x="56" y="266" class="text">│</text>

  <!-- DarkWolf -->
  <text x="20" y="292" class="text">├── 🌑 DarkWolf</text>
  <text x="56" y="316" class="text">│   ├── crawler/</text>
  <text x="56" y="340" class="text">│   ├── leak-monitor/</text>
  <text x="56" y="364" class="text">│   ├── intel-engine/</text>
  <text x="56" y="388" class="active">│   └── 🟢 ACTIVE</text>

  <text x="56" y="412" class="text">│</text>

  <!-- WolfHeaders -->
  <text x="20" y="438" class="text">└── 🛡️ WolfHeaders</text>
  <text x="56" y="462" class="text">    ├── analyzer/</text>
  <text x="56" y="486" class="text">    ├── recommendations/</text>
  <text x="56" y="510" class="planned">    └── 🟡 PLANNED</text>

  <!-- Footer -->
  <text x="20" y="530" class="text">3 projects, 9 modules</text>

</svg>
