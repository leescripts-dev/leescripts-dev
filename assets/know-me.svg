<?xml version="1.0" encoding="UTF-8"?>
<svg width="420"
     height="410"
     viewBox="0 0 420 410"
     xmlns="http://www.w3.org/2000/svg">

    <style>
        .title{
            font:700 17px "JetBrains Mono", monospace;
            fill:#F0F6FC;
        }

        .intro{
            font:700 15px "JetBrains Mono", monospace;
            fill:#58A6FF;
        }

        .text{
            font:13px "JetBrains Mono", monospace;
            fill:#F0F6FC;
        }

        .cursor{
            font:14px "JetBrains Mono", monospace;
            fill:#F0F6FC;
        }
    </style>

    <!-- Background -->
    <rect width="420" height="410" rx="12" fill="#0D1117"/>

    <!-- Header -->
    <rect width="420" height="42" rx="12" fill="#161B22"/>

    <!-- Title -->
    <text x="20" y="27" class="title">Know Me</text>

    <!-- Intro -->
    <text x="20" y="72" class="intro">Hi, I'm Lee.</text>

    <!-- Bio -->
   <text x="20" y="100" class="text">

    <tspan x="20" dy="0">
        I believe cybersecurity should be practical,
    </tspan>

    <tspan x="20" dy="18">
        accessible, and continuously evolving.
    </tspan>

    <tspan x="20" dy="28">
        My journey took me from Security Operations to GRC,
    </tspan>

    <tspan x="20" dy="18">
       where I found a passion for building tools that
    </tspan>

    <tspan x="20" dy="18">
        simplify security workflows and help organizations
    </tspan>

    <tspan x="20" dy="18">
         strengthen their security posture.
    </tspan>

    <tspan x="20" dy="28">
        Today I'm building TheWolfPack while expanding my
    </tspan>

    <tspan x="20" dy="18">
          cloud security knowledge and sharing everything I
    </tspan>

    <tspan x="20" dy="18">
        learn along the way.
    </tspan>

    <tspan x="20" dy="28">
        My goal is to build meaningful open-source security 
    </tspan>

    <tspan x="20" dy="18">
        tools that make life easier for defenders.
    </tspan>

    <tspan x="20" dy="28">
        Towards a Cyber-Safe World...
    </tspan>

    <tspan x="20" dy="28">
        Build | Commit | Repeat
    </tspan>

</text>

    <!-- Cursor -->
    <text x="200" y="365" class="cursor">
        █
        <animate
            attributeName="opacity"
            values="1;0;1"
            dur="1s"
            repeatCount="indefinite"/>
    </text>

</svg>
